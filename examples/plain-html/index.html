<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel — plain HTML / global UMD</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      p {
        margin: 12px;
      }
      #sheet {
        width: 600px;
        height: 300px;
        margin: 0 12px;
        border: 1px solid #d1d5db;
      }
    </style>
  </head>
  <body>
    <p>
      Zero build step: a single <code>&lt;script&gt;</code> tag loads the UMD
      bundle and exposes a <code>CyExcel</code> global.
    </p>
    <div id="sheet"></div>

    <!-- No bundler, no module system — just the UMD bundle built by `pnpm build`. -->
    <script src="../../dist/cyexcel.umd.cjs"></script>
    <script>
      var columns = [
        { id: "sku", field: "sku", width: 140, header: "SKU" },
        { id: "name", field: "name", width: 240, header: "Name" },
        { id: "price", field: "price", width: 100, type: "number", header: "Price" }
      ];
      // The i-th field is the i-th column — a parameter of the import, not of
      // the column config.
      var fields = ["sku", "name", "price"];
      var data = [
        { sku: "A100", name: "Widget", price: 9.99 },
        { sku: "A101", name: "Gadget", price: 14.5 },
        { sku: "A102", name: "Doohickey", price: 3.25 }
      ];

      // The sheet takes a snapshot, not a row array — the importer is on the
      // same global, so a plain <script> tag can still load data.
      new CyExcel.CyExcelCore(document.getElementById("sheet"), {
        columns: columns,
        snapshot: CyExcel.rowsToWorkbookSnapshot(data, fields)
      });
    </script>
  </body>
</html>
