<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel — plain HTML / global UMD</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      p {
        margin: 12px;
      }
      #sheet {
        width: 600px;
        height: 300px;
        margin: 0 12px;
        border: 1px solid #d1d5db;
      }
    </style>
  </head>
  <body>
    <p>
      Zero build step: a single <code>&lt;script&gt;</code> tag loads the UMD
      bundle and exposes a <code>CyExcel</code> global.
    </p>
    <div id="sheet"></div>

    <!-- No bundler, no module system — just the UMD bundle built by `pnpm build`. -->
    <script src="../../dist/cyexcel.umd.cjs"></script>
    <script>
      // No columns means Excel-style A/B/C headers.
      var data = [
        ["A100", "Widget", 9.99],
        ["A101", "Gadget", 14.5],
        ["A102", "Doohickey", 3.25]
      ];

      // The sheet takes a snapshot, not a row array — the importer is on the
      // same global, so a plain <script> tag can still load data.
      new CyExcel.CyExcelCore(document.getElementById("sheet"), {
        snapshot: CyExcel.matrixToWorkbookSnapshot(data)
      });
    </script>
  </body>
</html>
