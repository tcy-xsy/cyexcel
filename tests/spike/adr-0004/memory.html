<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ADR 0004 Spike — memory</title>
  </head>
  <body>
    <script type="module">
      import { MapCellMatrix } from "/tests/spike/adr-0004/MapCellMatrix.ts";
      import { ObjectCellMatrix } from "/tests/spike/adr-0004/ObjectCellMatrix.ts";
      import { fillBenchmarkMatrix } from "/tests/spike/adr-0004/buildMatrix.ts";
      import { buildBenchmarkRows } from "/tests/performance/support/dataset.ts";

      const ROW_COUNT = 100_000;
      const COLUMN_COUNT = 50;

      const shape = new URLSearchParams(location.search).get("shape") ?? "map";

      function readHeap() {
        return performance.memory?.usedJSHeapSize ?? null;
      }

      function nextFrame() {
        return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }

      function buildRowsFromJSON(rowCount, columnCount) {
        // Build rows via JSON.parse to produce fast-mode objects like real backend data
        const rows = [];

        // Build one row at a time via JSON.parse for fast-mode properties
        for (let row = 0; row < rowCount; row++) {
          const pairs = [];
          for (let col = 0; col < columnCount; col++) {
            pairs.push(`"c${col}":"${row},${col}"`);
          }
          const obj = JSON.parse(`{${pairs.join(',')}}`);
          rows.push(obj);
        }

        return rows;
      }

      async function run() {
        // Check gc() availability before measuring
        const gcAvailable = typeof gc === "function";

        await nextFrame();

        // Force GC before baseline measurement
        if (gcAvailable) {
          gc();
          gc();
          gc();
          gc();
          gc();
        }

        const before = readHeap();

        let held;
        let occupied;
        if (shape === "rows") {
          // 对照组：现有 ArrayDataSource 的形态（行对象数组，循环赋值）
          held = buildBenchmarkRows(ROW_COUNT, COLUMN_COUNT);
          occupied = ROW_COUNT * COLUMN_COUNT;
        } else if (shape === "rows-json") {
          // 对照组：JSON.parse 构造的行对象数组（快速模式）
          held = buildRowsFromJSON(ROW_COUNT, COLUMN_COUNT);
          occupied = ROW_COUNT * COLUMN_COUNT;
        } else {
          const matrix = shape === "object"
            ? new ObjectCellMatrix(ROW_COUNT, COLUMN_COUNT)
            : new MapCellMatrix(ROW_COUNT, COLUMN_COUNT);
          fillBenchmarkMatrix(matrix, ROW_COUNT, COLUMN_COUNT);
          held = matrix;
          occupied = matrix.occupiedCount();
        }

        await nextFrame();

        // Force GC before after-measurement
        if (gcAvailable) {
          gc();
          gc();
          gc();
          gc();
          gc();
        }

        const after = readHeap();

        window.__spikeMemory = {
          shape,
          occupied,
          beforeBytes: before,
          afterBytes: after,
          deltaBytes: before !== null && after !== null ? after - before : null,
          bytesPerCell: before !== null && after !== null ? (after - before) / occupied : null,
          gcAvailable
        };
        // 保持引用，防止读数前被回收
        window.__spikeHeld = held;
        window.__spikeReady = true;
      }

      void run();
    </script>
  </body>
</html>
