<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel dist/cyexcel.umd.cjs smoke test</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #app {
        width: 300px;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Real global UMD script tag, no <script type="module">, no import
         statement at all — this is what an actual npm consumer's
         require("cyexcel") (or a plain <script src> in a non-module page)
         resolves to. Regression test for the bug where this bundle used to
         only export defineCyExcel, not CyExcelCore. -->
    <script src="/dist/cyexcel.umd.cjs"></script>
    <script>
      var columns = [
        { width: 60 },
        { width: 60 }
      ];
      var fields = ["a", "b"];
      var data = Array.from({ length: 10 }, function (_unused, row) {
        return { a: row + "-a", b: row + "-b" };
      });

      // 导入器也必须在这个全局包里：入口只吃快照之后，UMD 消费者少了它就装不进
      // 任何数据（见 src/index.ts）。
      var sheet = new CyExcel.CyExcelCore(document.getElementById("app"), {
        columns: columns,
        snapshot: CyExcel.rowsToWorkbookSnapshot(data, fields)
      });

      window.__sheet = sheet;
      window.__cyexcelDistUmdReady = true;
    </script>
  </body>
</html>
