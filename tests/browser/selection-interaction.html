<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel selection interaction fixture</title>
    <style>
      .grid {
        position: relative;
        width: 500px;
        height: 400px;
        margin-bottom: 8px;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="grid-a" class="grid" tabindex="0"></div>
    <div id="grid-b" class="grid" tabindex="0"></div>
    <script type="module">
      import {
        CyExcelCore
      } from "/src/core/index.ts";

      function setup(containerId, globalName) {
        const container = document.getElementById(containerId);
        const sheet = new CyExcelCore(container, {
          data: Array.from({ length: 20 }, () => ({})),
          columns: Array.from({ length: 10 }, (_unused, column) => ({
            id: `column-${column}`,
            width: 50
          })),
          rowHeight: 20,
          showGridLines: false
        });
        Object.defineProperty(window, globalName, {
          configurable: true,
          get: () => sheet.selection
        });
        return sheet;
      }

      window.__gridASheet = setup("grid-a", "__gridASelection");
      window.__gridBSheet = setup("grid-b", "__gridBSelection");

      window.__cyexcelSelectionReady = true;
    </script>
  </body>
</html>
