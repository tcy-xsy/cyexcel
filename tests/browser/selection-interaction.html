<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel selection interaction fixture</title>
    <style>
      .grid {
        position: relative;
        width: 500px;
        height: 400px;
        margin-bottom: 8px;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="grid-a" class="grid" tabindex="0"></div>
    <div id="grid-b" class="grid" tabindex="0"></div>
    <script type="module">
      import {
        CyExcelCore,
        rowsToWorkbookSnapshot
      } from "/src/core/index.ts";

      const fields = Array.from({ length: 10 }, (_unused, column) => `column-${column}`);

      function setup(containerId, globalName) {
        const container = document.getElementById(containerId);
        const sheet = new CyExcelCore(container, {
          // 20 行 10 列，一个格子都没有值：稀疏矩阵里这就是一张空矩阵，
          // 坐标空间整个来自 blank（派生坐标空间，ADR 0004 §3.3）。
          snapshot: rowsToWorkbookSnapshot([], fields, { blankRows: 20 }),
          columns: fields.map((field) => ({
            id: field,
            width: 50
          })),
          rowHeight: 20,
          showGridLines: false
        });
        Object.defineProperty(window, globalName, {
          configurable: true,
          get: () => sheet.selection
        });
        return sheet;
      }

      window.__gridASheet = setup("grid-a", "__gridASelection");
      window.__gridBSheet = setup("grid-b", "__gridBSelection");

      window.__cyexcelSelectionReady = true;
    </script>
  </body>
</html>
