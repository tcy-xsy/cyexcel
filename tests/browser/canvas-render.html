<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel canvas render fixture</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script type="module">
      import {
        ContentLayerRenderer,
        LayoutEngine,
        SceneSnapshot,
        SkeletonSnapshot,
        ViewportSnapshot,
        configureCanvasForDpr
      } from "/src/core/index.ts";

      const canvas = document.getElementById("canvas");
      const dpr = window.devicePixelRatio || 1;
      const logicalWidth = 300;
      const logicalHeight = 100;

      configureCanvasForDpr(canvas, logicalWidth, logicalHeight, dpr);
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const layout = new LayoutEngine({
        rowCount: 5,
        columnCount: 5,
        rowHeight: 20,
        columnWidths: [60, 60, 60, 60, 60]
      });
      const scene = new SceneSnapshot({
        version: 1,
        skeleton: SkeletonSnapshot.fromLayout(layout, 0),
        viewport: new ViewportSnapshot({
          version: 1,
          scrollTop: 0,
          scrollLeft: 0,
          width: logicalWidth,
          height: logicalHeight
        })
      });

      const renderer = new ContentLayerRenderer({
        ctx,
        getScene: () => scene,
        getCellValue: (row, column) => `R${row}C${column}`
      });
      renderer.paintContent({ kind: "full" }, scene);

      window.__cyexcelRenderReady = true;
    </script>
  </body>
</html>
