<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel sort fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #app {
        width: 400px;
        height: 250px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { ArrayDataSource, CyExcelCore } from "/src/core/index.ts";

      const container = document.getElementById("app");

      // Set by a test that wants to abort from inside the comparator, i.e.
      // during computation rather than before sortByColumn() is entered.
      let onCompare = null;

      const columnTypes = {
        // The comparator is written as an *object method* that reads `this`,
        // which is what "排序比较函数支持列级自定义" looks like when the order
        // comes from the column's own configuration: rank by the configured
        // option order, not alphabetically. Detaching this function from its
        // column breaks it.
        priority: {
          format: (value) => (value === undefined || value === null ? "" : String(value)),
          compare(left, right) {
            onCompare?.();
            const ranked = this.options.map((option) => option.value);
            return ranked.indexOf(left) - ranked.indexOf(right);
          }
        }
      };

      const columns = [
        { id: "name", field: "name", width: 120, header: "Name" },
        { id: "score", field: "score", width: 80, header: "Score", type: "number" },
        { id: "joined", field: "joined", width: 110, header: "Joined", type: "date" },
        {
          id: "priority",
          field: "priority",
          width: 90,
          header: "Priority",
          type: "priority",
          // Lives on the *column*, not on the cell type, so `this.options`
          // resolving proves the comparator is invoked through the runtime
          // column and not through the bare registered type.
          options: [{ value: "low" }, { value: "medium" }, { value: "high" }]
        }
      ];
      // Deliberately asymmetric: ascending by "name" is [2, 0, 1]
      // (apple <- 2, banana <- 0, cherry <- 1), which is not its own inverse,
      // so a direction bug cannot survive undo.
      //
      // The dates are picked so weekday-name order (what String(date) gives)
      // and chronological order disagree: Sat / Wed / Mon vs 11th / 1st / 6th.
      //
      // Priority rank order (low < medium < high) also disagrees with
      // alphabetical order (high < low < medium), so sorting by it can only
      // come out right through the column's own comparator.
      const rows = [
        {
          name: "banana",
          score: 2,
          joined: new Date(Date.UTC(2020, 0, 11, 12)),
          priority: "high"
        },
        {
          name: "cherry",
          score: 3,
          joined: new Date(Date.UTC(2020, 0, 1, 12)),
          priority: "low"
        },
        {
          name: "apple",
          score: 1,
          joined: new Date(Date.UTC(2020, 0, 6, 12)),
          priority: "medium"
        }
      ];

      const variant = new URLSearchParams(location.search).get("dataSource");

      // Only the four required DataSource methods: no beginTransaction at
      // all, so no mutation of any kind can be staged.
      const minimalDataSource = {
        getRowCount: () => rows.length,
        getColumnCount: () => columns.length,
        getCell: (row, column) => rows[row][columns[column].field],
        setCell: (row, column, value) => {
          rows[row][columns[column].field] = value;
        }
      };

      // Fully transactional and structurally editable, but with no
      // reorderRows(): the case the reorder capability check exists for.
      const backing = new ArrayDataSource(
        rows,
        columns.map((column) => ({ id: column.id, field: column.field }))
      );
      const noReorderDataSource = {
        getRowCount: () => backing.getRowCount(),
        getColumnCount: () => backing.getColumnCount(),
        getCell: (row, column) => backing.getCell(row, column),
        setCell: (row, column, value) => backing.setCell(row, column, value),
        beginTransaction: (revision) => backing.beginTransaction(revision),
        insertRows: (start, inserted) => backing.insertRows(start, inserted),
        deleteRows: (start, count) => backing.deleteRows(start, count),
        moveRows: (start, count, target) => backing.moveRows(start, count, target)
        // No reorderRows on purpose.
      };

      const dataSource =
        variant === "minimal"
          ? minimalDataSource
          : variant === "no-reorder"
            ? noReorderDataSource
            : undefined;

      const sheet = new CyExcelCore(container, {
        columns,
        columnTypes,
        ...(dataSource ? { dataSource } : { data: rows }),
        rowHeight: 20,
        headerHeight: 20,
        rowHeaderWidth: 40
      });

      // CyExcelCore exposes no history size, so committed transactions are
      // counted instead: a sort that reports itself cancelled must not have
      // produced one.
      let commitCount = 0;
      sheet.events.on("change", () => {
        commitCount += 1;
      });

      window.__sort = {
        sheet,
        getCommitCount: () => commitCount,
        setOnCompare: (hook) => {
          onCompare = hook;
        }
      };
      window.__sortFixtureReady = true;
    </script>
  </body>
</html>
