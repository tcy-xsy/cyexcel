<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel sort fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #app {
        width: 400px;
        height: 250px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { CyExcelCore, rowsToWorkbookSnapshot } from "/src/core/index.ts";

      const container = document.getElementById("app");

      // Set by a test that wants to abort from inside the comparator, i.e.
      // during computation rather than before sortByColumn() is entered.
      let onCompare = null;

      const columnTypes = {
        // The comparator is written as an *object method* that reads `this`,
        // which is what "排序比较函数支持列级自定义" looks like when the order
        // comes from the column's own configuration: rank by the configured
        // option order, not alphabetically. Detaching this function from its
        // column breaks it.
        priority: {
          format: (value) => (value === undefined || value === null ? "" : String(value)),
          compare(left, right) {
            onCompare?.();
            const ranked = this.options.map((option) => option.value);
            return ranked.indexOf(left) - ranked.indexOf(right);
          }
        }
      };

      // `?header=custom` puts a *custom* canvas renderer on the "name"
      // column whose hitTest reports `toggle-sort` for any point in the
      // cell. A custom renderer's `toggle-sort` is a pure notification —
      // the host decides what it means — so the core must emit
      // `header-action` for it without sorting anything itself.
      const customNameHeaderRenderer = {
        kind: "canvas",
        paint({ ctx, rect, title }) {
          ctx.fillStyle = "#111827";
          ctx.textBaseline = "middle";
          ctx.fillText(title, rect.x + 4, rect.y + rect.height / 2);
        },
        hitTest() {
          return { type: "toggle-sort" };
        }
      };
      const customHeaders = new URLSearchParams(location.search).get("header") === "custom";

      const fields = ["name", "score", "joined", "priority"];
      const columns = [
        {
          width: 120,
          header: customHeaders ? { title: "Name", renderer: customNameHeaderRenderer } : "Name"
        },
        {
          // `?narrow=1` shrinks this column below the width at which a sort
          // zone and a selection zone can coexist in one header.
          width: new URLSearchParams(location.search).get("narrow") === "1" ? 10 : 80,
          header: "Score",
          type: "number"
        },
        {
          width: 110,
          header: "Joined",
          type: "date",
          // `?unsortable=1` turns this column off at the column level, which is
          // the override that has to beat the type's own answer.
          ...(new URLSearchParams(location.search).get("unsortable") === "1"
            ? { sortable: false }
            : {})
        },
        {
          width: 90,
          header: "Priority",
          type: "priority",
          // Lives on the *column*, not on the cell type, so `this.options`
          // resolving proves the comparator is invoked through the runtime
          // column and not through the bare registered type.
          options: [{ value: "low" }, { value: "medium" }, { value: "high" }]
        }
      ];
      // Deliberately asymmetric: ascending by "name" is [2, 0, 1]
      // (apple <- 2, banana <- 0, cherry <- 1), which is not its own inverse,
      // so a direction bug cannot survive undo.
      //
      // The dates are picked so weekday-name order (what String(date) gives)
      // and chronological order disagree: Sat / Wed / Mon vs 11th / 1st / 6th.
      //
      // Priority rank order (low < medium < high) also disagrees with
      // alphabetical order (high < low < medium), so sorting by it can only
      // come out right through the column's own comparator.
      const rows = [
        {
          name: "banana",
          score: 2,
          joined: new Date(Date.UTC(2020, 0, 11, 12)),
          priority: "high"
        },
        {
          name: "cherry",
          score: 3,
          joined: new Date(Date.UTC(2020, 0, 1, 12)),
          priority: "low"
        },
        {
          name: "apple",
          score: 1,
          joined: new Date(Date.UTC(2020, 0, 6, 12)),
          priority: "medium"
        }
      ];

      // `?dataSource=minimal` / `?dataSource=no-reorder` used to swap in a
      // hand-written data layer with fewer capabilities, which is how the
      // three "refuses to sort" cases got their refusal. ADR 0004 §3.2 took
      // the replaceable data layer away, so there is no longer a way to build
      // a table that cannot reorder — those cases went with it (4B 设计 §7
      // 第 5 条).
      const sheet = new CyExcelCore(container, {
        columns,
        columnTypes,
        snapshot: rowsToWorkbookSnapshot(rows, fields),
        rowHeight: 20,
        headerHeight: 20,
        rowHeaderWidth: 40
      });

      // CyExcelCore exposes no history size, so committed transactions are
      // counted instead: a sort that reports itself cancelled must not have
      // produced one.
      let commitCount = 0;
      sheet.events.on("change", () => {
        commitCount += 1;
      });

      const headerActions = [];
      sheet.events.on("header-action", ({ action, column }) => {
        headerActions.push({ action: { ...action }, column });
      });

      window.__sort = {
        sheet,
        getCommitCount: () => commitCount,
        getHeaderActions: () => headerActions.map((entry) => ({ ...entry })),
        setOnCompare: (hook) => {
          onCompare = hook;
        }
      };
      window.__sortFixtureReady = true;
    </script>
  </body>
</html>
