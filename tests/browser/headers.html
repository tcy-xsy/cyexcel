<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel headers + frozen layout fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #app {
        /* Narrower than the 510px total column width, so there's real
           horizontal overflow to scroll through (needed by the alignment
           test) — the resize test scrolls the status column back into view
           itself after growing an earlier column. */
        width: 420px;
        height: 300px;
      }
      .status-select {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { CyExcelCore, createBasicContextMenuPlugin, rowsToWorkbookSnapshot } from "/src/core/index.ts";

      const container = document.getElementById("app");
      let headerDomPointerId = null;

      const statusHeaderFactory = {
        kind: "dom",
        pointerOwnership: "native",
        create() {
          let select;
          return {
            mount(host) {
              select = document.createElement("select");
              select.className = "status-select";
              for (const label of ["All", "Active", "Archived"]) {
                const option = document.createElement("option");
                option.textContent = label;
                select.append(option);
              }
              select.addEventListener("pointerdown", (event) => {
                headerDomPointerId = event.pointerId;
              });
              host.append(select);
            },
            update() {},
            destroy() {
              select.remove();
            }
          };
        }
      };

      const closedNativeHeaderFactory = {
        kind: "dom",
        pointerOwnership: "native",
        create() {
          let input;
          let hostElement;
          return {
            mount(host) {
              hostElement = host;
              host.classList.add("closed-native-header");
              const shadow = host.attachShadow({ mode: "closed" });
              const style = document.createElement("style");
              style.textContent = "input { box-sizing: border-box; width: 100%; height: 100%; }";
              input = document.createElement("input");
              input.value = "closed header";
              shadow.append(style, input);
            },
            update() {},
            destroy() {
              hostElement.classList.remove("closed-native-header");
              input.remove();
            }
          };
        }
      };

      let headerHitMode = "handled";
      let headerHitTestCalls = 0;
      const headerActions = [];
      const headerErrors = [];
      const priceHeaderRenderer = {
        kind: "canvas",
        paint({ ctx, rect, title }) {
          ctx.fillStyle = "#111827";
          ctx.textBaseline = "middle";
          ctx.fillText(title, rect.x + 8, rect.y + rect.height / 2);
        },
        hitTest() {
          headerHitTestCalls += 1;
          if (headerHitMode === "decline") {
            return undefined;
          }
          if (headerHitMode === "throw") {
            throw new Error("forced header hit-test failure");
          }
          return { type: "toggle-sort" };
        }
      };

      const fields = ["sku", "name", "price", "qty", "status", "closed"];
      const columns = [
        { width: 100, header: "SKU" },
        { width: 140, header: "Name" },
        {
          width: 90,
          header: { title: "Price", renderer: priceHeaderRenderer },
          minWidth: 60,
          maxWidth: 200
        },
        { width: 80, header: "Qty" },
        { width: 100, header: { title: "Status", renderer: statusHeaderFactory } },
        { width: 100, header: { title: "Closed", renderer: closedNativeHeaderFactory } }
      ];

      const headerGroups = [
        { id: "basics", title: "Basics", columns: [0, 1] },
        { id: "sales", title: "Sales", columns: [2, 3] }
      ];

      const data = Array.from({ length: 50 }, (_unused, index) => ({
        sku: `CY-${String(index + 1).padStart(4, "0")}`,
        name: `Item ${index}`,
        price: index * 10,
        qty: index,
        status: index % 2 === 0 ? "Active" : "Archived",
        closed: "closed"
      }));

      const sheet = new CyExcelCore(container, {
        columns,
        snapshot: rowsToWorkbookSnapshot(data, fields),
        headerGroups,
        rowHeight: 24,
        headerHeight: 28,
        freeze: { rows: 1, columns: 1 },
        plugins: [createBasicContextMenuPlugin()]
      });

      sheet.events.on("header-action", ({ action, column, header, structureVersion }) => {
        headerActions.push({
          action,
          column,
          header: { column: header.column, title: header.title },
          structureVersion
        });
      });
      sheet.events.on("error", ({ error, eventName }) => {
        if (eventName.startsWith("interaction:canvas-header-hit-test:")) {
          headerErrors.push({ eventName, message: String(error?.message ?? error) });
        }
      });

      window.__sheet = sheet;
      window.__setHeaderHitMode = (mode) => {
        headerHitMode = mode;
      };
      window.__headerHitTestCalls = () => headerHitTestCalls;
      window.__headerActions = headerActions;
      window.__headerErrors = headerErrors;
      window.__headerDomHasPointerCapture = () =>
        headerDomPointerId !== null &&
        Array.from(document.querySelectorAll("#app canvas")).some((canvas) =>
          canvas.hasPointerCapture(headerDomPointerId)
        );
      window.__cyexcelHeadersReady = true;
    </script>
  </body>
</html>
