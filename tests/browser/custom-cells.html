<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel custom cell renderers fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #app {
        width: 650px;
        height: 300px;
      }
      .toggle-button {
        width: 50%;
        height: 100%;
        border: 0;
        cursor: pointer;
      }
      .toggle-passive {
        display: inline-flex;
        width: 50%;
        height: 100%;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { CyExcelCore, rowsToWorkbookSnapshot } from "/src/core/index.ts";

      const container = document.getElementById("app");

      const counterRenderer = {
        kind: "canvas",
        paint({ ctx, rect, value }) {
          ctx.fillStyle = "#0a7a3d";
          // Deliberately changes ctx.font and never restores it — a
          // realistic custom renderer that doesn't clean up after itself.
          // ContentLayerRenderer is responsible for isolating this so it
          // doesn't leak into whichever cell gets painted next (see
          // doc/progress.md's "canvas 状态跨格子污染" patch). Picked large
          // enough to be clearly distinguishable from the 13px default but
          // not so large it gets clipped away by the 24px row height.
          ctx.font = "18px serif";
          ctx.textBaseline = "middle";
          ctx.textAlign = "left";
          ctx.fillText(`n=${value}`, rect.x + 4, rect.y + rect.height / 2);
        },
        hitTest({ row, value }) {
          window.__canvasHitTestCalls[row] = (window.__canvasHitTestCalls[row] ?? 0) + 1;
          if (row === 1) {
            return undefined;
          }
          return { type: "set-value", value: Number(value) + 1 };
        }
      };

      const toggleRendererFactory = {
        kind: "dom",
        pointerOwnership: "surface",
        create() {
          let button;
          let passive;
          let currentValue;
          let commit;
          return {
            mount(host, context) {
              button = document.createElement("button");
              button.type = "button";
              button.className = "toggle-button";
              currentValue = context.value;
              commit = context.actions.commit;
              button.textContent = currentValue ? "on" : "off";
              button.addEventListener("click", () => {
                commit(!currentValue);
              });
              passive = document.createElement("span");
              passive.className = "toggle-passive";
              passive.textContent = "select";
              host.append(button, passive);
            },
            update(context) {
              currentValue = context.value;
              commit = context.actions.commit;
              button.textContent = currentValue ? "on" : "off";
            },
            destroy() {
              button.remove();
              passive.remove();
            }
          };
        }
      };

      function createClosedShadowRenderer(pointerOwnership, className, tagName) {
        return {
          kind: "dom",
          pointerOwnership,
          create() {
            let element;
            let hostElement;
            return {
              mount(host) {
                hostElement = host;
                host.classList.add(className);
                const shadow = host.attachShadow({ mode: "closed" });
                const style = document.createElement("style");
                style.textContent = ":host { display: block; } .target { box-sizing: border-box; display: flex; width: 100%; height: 100%; align-items: center; }";
                element = document.createElement(tagName);
                element.className = "target";
                if (element instanceof HTMLInputElement) {
                  element.value = "closed native";
                } else {
                  element.textContent = "closed surface";
                }
                shadow.append(style, element);
              },
              update() {},
              destroy() {
                hostElement.classList.remove(className);
                element.remove();
              }
            };
          }
        };
      }

      const closedNativeRendererFactory = createClosedShadowRenderer(
        "native",
        "closed-native-cell",
        "input"
      );
      const closedSurfaceRendererFactory = createClosedShadowRenderer(
        "surface",
        "closed-surface-cell",
        "span"
      );

      const fields = ["name", "counter", "toggle", "price", "closedNative", "closedSurface"];
      const columns = [
        { id: "name", field: "name", width: 120 },
        { id: "counter", field: "counter", width: 100, renderer: counterRenderer },
        { id: "toggle", field: "toggle", width: 100, renderer: toggleRendererFactory },
        // Built-in "number" CellType, no custom renderer — exercises
        // CellType.parse() on commit (see doc/progress.md's "编辑数字/money
        // 列后单元格变空" patch).
        { id: "price", field: "price", width: 100, type: "number" },
        { id: "closedNative", field: "closedNative", width: 100, renderer: closedNativeRendererFactory },
        { id: "closedSurface", field: "closedSurface", width: 100, renderer: closedSurfaceRendererFactory }
      ];

      const data = Array.from({ length: 200 }, (_unused, index) => ({
        name: `Item ${index}`,
        counter: index,
        toggle: index % 2 === 0,
        price: index * 10,
        closedNative: "native",
        closedSurface: "surface"
      }));

      window.__canvasHitTestCalls = {};

      const sheet = new CyExcelCore(container, {
        columns,
        snapshot: rowsToWorkbookSnapshot(data, fields),
        rowHeight: 24
      });

      window.__sheet = sheet;
      window.__cyexcelCustomCellsReady = true;
    </script>
  </body>
</html>
