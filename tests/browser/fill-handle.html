<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel fill-handle fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #app {
        width: 500px;
        height: 300px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { CyExcelCore, rowsToWorkbookSnapshot } from "/src/core/index.ts";

      const container = document.getElementById("app");

      // Column layout (each 60px wide, rows 20px tall):
      //   0 neighbor   — 10 non-empty rows (0-9), used as the dblclick auto-fill reference.
      //   1 dblTarget  — row 0 only, filled via dblclick auto-fill matching column 0's length.
      //   2 dragCopy   — row 0 only, filled via a single-value drag-copy.
      //   3 dragSeq    — rows 0-2 (1, 2, 3), extended via a numeric linear-sequence drag.
      //   4 undoTarget — row 0 only, drag-filled then undone.
      //   5 readonly   — clipboard.paste: false, row 0 only; must stay blank in the extended region.
      //   6 normal     — row 0 only, paired with column 5 in the same drag gesture.
      //   7 mergeFill  — rows 1-2 merged (anchor "MERGED"); dragging a source
      //     selection spanning rows 0-3 (across the merge) down through row 7
      //     must read the covered row 2 as "MERGED", not null, or the cyclic
      //     repeat pattern breaks.
      const fields = [
        "neighbor",
        "dblTarget",
        "dragCopy",
        "dragSeq",
        "undoTarget",
        "readonly",
        "normal",
        "mergeFill"
      ];
      const columns = [
        { width: 60, header: "N" },
        { width: 60, header: "D" },
        { width: 60, header: "C" },
        { width: 60, header: "S" },
        { width: 60, header: "U" },
        { width: 60, header: "R", clipboard: { paste: false } },
        { width: 60, header: "M" },
        { width: 60, header: "MF" }
      ];

      const data = Array.from({ length: 30 }, (_unused, row) => ({
        neighbor: row < 10 ? `N${row}` : undefined,
        dblTarget: row === 0 ? "Y" : undefined,
        dragCopy: row === 0 ? "X" : undefined,
        dragSeq: row === 0 ? 1 : row === 1 ? 2 : row === 2 ? 3 : undefined,
        undoTarget: row === 0 ? "Z" : undefined,
        readonly: row === 0 ? "RO" : undefined,
        normal: row === 0 ? "OK" : undefined,
        mergeFill: row === 0 ? "M0" : row === 1 ? "MERGED" : row === 3 ? "M3" : undefined
      }));

      const sheet = new CyExcelCore(container, {
        columns,
        snapshot: rowsToWorkbookSnapshot(data, fields),
        rowHeight: 20
      });
      sheet.mergeCells({ startRow: 1, startColumn: 7, endRow: 2, endColumn: 7 });

      window.__sheet = sheet;
      window.__cyexcelFillHandleReady = true;
    </script>
  </body>
</html>
