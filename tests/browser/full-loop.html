<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel full loop fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #app {
        width: 400px;
        height: 300px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { CyExcelCore, rowsToWorkbookSnapshot } from "/src/core/index.ts";

      const container = document.getElementById("app");
      const fields = ["name", "price", "qty"];
      const columns = [
        { width: 120 },
        { width: 100 },
        { width: 100 }
      ];
      const data = Array.from({ length: 50 }, (_unused, index) => ({
        name: `Item ${index}`,
        price: index * 10,
        qty: index
      }));

      const sheet = new CyExcelCore(container, {
        columns,
        snapshot: rowsToWorkbookSnapshot(data, fields),
        rowHeight: 24
      });

      window.__sheet = sheet;
      window.__originalData = data;
      window.__cyexcelFullLoopReady = true;
    </script>
  </body>
</html>
