<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel single-cell-update benchmark (1,000,000 rows)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #app {
        width: 900px;
        height: 500px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { CyExcelCore } from "/dist/core.js";
      import { buildBenchmarkColumns, buildBenchmarkRows } from "/tests/performance/support/dataset.ts";

      const ROW_COUNT = 1_000_000;
      const COLUMN_COUNT = 20;
      // Deliberately far outside the initial viewport (row 0) so this
      // exercises the "a single-cell write doesn't scan/repaint the whole
      // table" claim, not just a cell that was already visible/painted.
      const TARGET_ROW = 500_000;
      const TARGET_COLUMN = 5;

      const container = document.getElementById("app");
      const columns = buildBenchmarkColumns(COLUMN_COUNT);
      const data = buildBenchmarkRows(ROW_COUNT, COLUMN_COUNT);
      const sheet = new CyExcelCore(container, { columns, data, rowHeight: 24 });

      function nextFrame() {
        return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }

      /** commandMs: sync Command+Patch cost of setCell(). paintMs: isolated repaint cost after that, not cumulative. */
      async function updateOne() {
        const before = performance.now();
        sheet.setCell(TARGET_ROW, TARGET_COLUMN, `updated-${Math.random()}`);
        const afterCommand = performance.now();

        await nextFrame();
        const afterPaint = performance.now();

        return { commandMs: afterCommand - before, paintMs: afterPaint - afterCommand };
      }

      window.__sheet = sheet;
      window.__cyexcelUpdateOne = updateOne;
      window.__cyexcelPerfReady = true;
    </script>
  </body>
</html>
