<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyexcel component-lifecycle benchmark (100x construct/dispose)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #app {
        width: 600px;
        height: 400px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { CyExcelCore } from "/dist/core.js";
      import { buildBenchmarkColumns, buildBenchmarkRows } from "/tests/performance/support/dataset.ts";

      const COLUMN_COUNT = 10;
      const ROW_COUNT = 1000;

      const container = document.getElementById("app");
      const columns = buildBenchmarkColumns(COLUMN_COUNT);
      const data = buildBenchmarkRows(ROW_COUNT, COLUMN_COUNT);

      function nextFrame() {
        return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }

      // Core-only, per doc/implementation-steps.md:551 — Step 13's
      // `<cy-excel>` wrapper was explicitly skipped, and the shell that
      // does exist (src/element/CyExcelElement.ts) has no
      // connectedCallback/disconnectedCallback, so there's no meaningful
      // "connect/disconnect" lifecycle to exercise beyond construct+dispose.
      async function runLifecycle(iterations) {
        const heapSamples = [];
        for (let i = 0; i < iterations; i += 1) {
          const sheet = new CyExcelCore(container, { columns, data, rowHeight: 24 });
          await nextFrame();
          sheet.dispose();
          if (i % 5 === 0 || i === iterations - 1) {
            heapSamples.push(performance.memory?.usedJSHeapSize ?? null);
          }
        }
        return { heapSamples, domNodeCountAfter: container.querySelectorAll("*").length };
      }

      window.__cyexcelRunLifecycle = runLifecycle;
      window.__cyexcelPerfReady = true;
    </script>
  </body>
</html>
